{% extends "base_new.html" %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-6">{{ page_title }}</h1>
  <form method="post" class="bg-white shadow rounded-lg p-6 space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Payroll Run</label>
      <select name="payroll_run" required class="w-full border rounded px-3 py-2">
        <option value="">Select payroll run</option>
        {% for run in runs %}
        <option value="{{ run.pk }}">{{ run.name }} ({{ run.paydays }})</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Bank</label>
      <select name="bank_code" required class="w-full border rounded px-3 py-2">
        <option value="">Select bank</option>
        {% for name, code in bank_codes.items %}
        <option value="{{ code }}">{{ name }} ({{ code }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="flex justify-end space-x-3">
      <a href="{% url 'payroll:bank_payment_list' %}" class="px-4 py-2 border rounded text-gray-700 hover:bg-gray-50">Cancel</a>
      <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Generate</button>
    </div>
  </form>
</div>
{% endblock %}
