{% extends "base_new.html" %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-6">{{ page_title }}</h1>
  <form method="post" class="bg-white shadow rounded-lg p-6 space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Employee</label>
      <select name="employee" required class="w-full border rounded px-3 py-2">
        <option value="">Select employee</option>
        {% for emp in employees %}
        <option value="{{ emp.id|stringformat:"d" }}">{{ emp.first_name }} {{ emp.last_name }} ({{ emp.job_title }})</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">New Title</label>
      <input type="text" name="new_title" required class="w-full border rounded px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Effective Date</label>
      <input type="date" name="effective_date" required class="w-full border rounded px-3 py-2">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Reason</label>
      <textarea name="reason" rows="3" class="w-full border rounded px-3 py-2"></textarea>
    </div>
    <div class="flex justify-end space-x-3">
      <a href="{% url 'payroll:promotion_list' %}" class="px-4 py-2 border rounded text-gray-700 hover:bg-gray-50">Cancel</a>
      <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Create Promotion</button>
    </div>
  </form>
</div>
{% endblock %}
