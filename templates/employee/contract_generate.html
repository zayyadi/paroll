{% extends "base_new.html" %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-6">{{ page_title }}</h1>
  <form method="post" class="bg-white shadow rounded-lg p-6 space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Employee</label>
      <select name="employee" required class="w-full border rounded px-3 py-2">
        <option value="">Select employee</option>
        {% for emp in employees %}
        <option value="{{ emp.id|stringformat:"d" }}">{{ emp.first_name }} {{ emp.last_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Template</label>
      <select name="template" class="w-full border rounded px-3 py-2">
        <option value="">Default template</option>
        {% for t in templates %}
        <option value="{{ t.pk }}">{{ t.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Start Date</label>
        <input type="date" name="start_date" required class="w-full border rounded px-3 py-2">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">End Date (optional)</label>
        <input type="date" name="end_date" class="w-full border rounded px-3 py-2">
      </div>
    </div>
    <div class="flex justify-end space-x-3">
      <a href="{% url 'payroll:contract_list' %}" class="px-4 py-2 border rounded text-gray-700 hover:bg-gray-50">Cancel</a>
      <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Generate</button>
    </div>
  </form>
</div>
{% endblock %}
