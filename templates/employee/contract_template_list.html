{% extends "base_new.html" %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 py-8">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">{{ page_title }}</h1>
    <a href="{% url 'payroll:contract_template_create' %}" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">New Template</a>
  </div>
  <div class="bg-white shadow rounded-lg overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Active</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Created</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-gray-200">
        {% for t in templates %}
        <tr class="hover:bg-gray-50">
          <td class="px-6 py-4 whitespace-nowrap font-medium">{{ t.name }}</td>
          <td class="px-6 py-4 whitespace-nowrap">{% if t.is_active %}Yes{% else %}No{% endif %}</td>
          <td class="px-6 py-4 whitespace-nowrap">{{ t.created_at|date:"d M Y" }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3" class="px-6 py-4 text-center text-gray-500">No templates found.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
