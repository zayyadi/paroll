{% extends "inventory/base.html" %}
{% block content %}
<div class="flex justify-between items-center mb-6">
  <h1 class="text-2xl font-bold">{{ page_title }}</h1>
  <a href="{% url 'inventory:location_create' %}" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">New Location</a>
</div>
<div class="bg-white shadow rounded-lg overflow-hidden">
  <table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Warehouse</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Code</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Action</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-200">
      {% for loc in locations %}
      <tr class="hover:bg-gray-50">
        <td class="px-6 py-4 whitespace-nowrap">{{ loc.warehouse }}</td>
        <td class="px-6 py-4 whitespace-nowrap">{{ loc.code }}</td>
        <td class="px-6 py-4 whitespace-nowrap">{{ loc.name }}</td>
        <td class="px-6 py-4 whitespace-nowrap"><a href="{% url 'inventory:location_update' loc.pk %}" class="text-blue-600 hover:underline">Edit</a></td>
      </tr>
      {% empty %}
      <tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">No locations found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
