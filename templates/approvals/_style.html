<style>.approval-shell{max-width:1100px;margin:auto}.approval-card{background:white;border:1px solid #dce5e9;border-radius:16px;padding:24px;margin-bottom:20px}.approval-shell input:not([type=checkbox]),.approval-shell select,.approval-shell textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:10px;background:white}.approval-shell label{font-weight:600;font-size:14px;display:block;margin-bottom:6px}.approval-shell button,.approval-button{display:inline-block;background:#005c73;color:white;padding:10px 18px;border-radius:8px;font-weight:600}.approval-shell .approval-secondary{background:#eef4f6;color:#264653}.approval-shell .approval-danger{background:#9f1239}.approval-shell .errorlist,.approval-error{color:#9f1239;background:#fff1f2;padding:12px;border-radius:8px}.approval-shell .helptext{display:block;color:#526577;font-size:13px;margin-top:5px}.approval-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.approval-muted{color:#526577;font-size:14px}.approval-table{width:100%;border-collapse:collapse}.approval-table th,.approval-table td{text-align:left;padding:14px 10px;border-bottom:1px solid #e8eef1}.approval-badge{font-size:12px;font-weight:700;background:#edf5f7;color:#005c73;border-radius:20px;padding:5px 10px}.approval-stage{border-left:3px solid #8baeb8;padding:10px 16px;margin:12px 0}.approval-form-field{margin:16px 0}@media(max-width:700px){.approval-grid{grid-template-columns:1fr}.approval-card{padding:16px}.approval-table-wrap{overflow-x:auto}}</style>
