{% extends "accounting/base.html" %}

{% block page_title %}Verify Identity{% endblock %}

{% block accounting_content %}
<div class="space-y-6">
  <div>
    <h2 class="font-headline text-2xl font-extrabold text-primary-800">Verify Your Identity</h2>
    <p class="text-sm text-secondary-500 mt-1">Re-enter your password to continue. This verification is valid for 15 minutes.</p>
  </div>

  <div class="bg-white ghost-border rounded-[1rem] p-6 max-w-sm">
    <form method="post">
      {% csrf_token %}
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-secondary-700 mb-1">Password</label>
          <input type="password" name="password" class="form-input block w-full rounded-md border-secondary-300 text-sm" placeholder="Enter your password" required autofocus>
        </div>
        <div>
          <button type="submit" class="w-full px-6 py-2 text-sm font-medium text-white bg-primary-600 rounded-md hover:bg-primary-700">Verify</button>
        </div>
      </div>
    </form>
  </div>
</div>
{% endblock %}
