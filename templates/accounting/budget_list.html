{% extends "accounting/base_accounting.html" %}
{% block content %}
<div class="flex justify-between items-center mb-6">
  <h1 class="text-2xl font-bold">{{ page_title }}</h1>
  <a href="{% url 'accounting:budget_create' %}" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">New Budget</a>
</div>
<div class="bg-white shadow rounded-lg overflow-hidden">
  <table class="min-w-full divide-y divide-gray-200">
    <thead class="bg-gray-50">
      <tr>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Name</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Fiscal Year</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Action</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-gray-200">
      {% for b in budgets %}
      <tr class="hover:bg-gray-50">
        <td class="px-6 py-4 whitespace-nowrap font-medium">{{ b.name }}</td>
        <td class="px-6 py-4 whitespace-nowrap">{{ b.fiscal_year }}</td>
        <td class="px-6 py-4 whitespace-nowrap">
          <span class="px-2 py-1 text-xs rounded-full {% if b.status == 'APPROVED' %}bg-green-100 text-green-800{% elif b.status == 'DRAFT' %}bg-gray-100 text-gray-800{% else %}bg-yellow-100 text-yellow-800{% endif %}">{{ b.get_status_display }}</span>
        </td>
        <td class="px-6 py-4 whitespace-nowrap"><a href="{% url 'accounting:budget_detail' b.pk %}" class="text-blue-600 hover:underline">View</a></td>
      </tr>
      {% empty %}
      <tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">No budgets found.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
