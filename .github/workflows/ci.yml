name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  django:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DJANGO_SETTINGS_MODULE: core.settings_test
      SECRET_KEY: ci-only-secret-key
      DEBUG: "False"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install CI-only quality tools
        run: |
          pip install ruff black isort mypy bandit pip-audit coverage

      - name: Lint (ruff)
        run: ruff check accounting api company core marketing monthyear payroll standup users

      - name: Format check (black)
        run: black --check accounting api company core payroll users --diff

      - name: Import order (isort)
        run: isort --check-only --diff accounting api company core payroll users

      - name: Type check (mypy, non-blocking)
        run: mypy company/api api/v1/serializers.py company/tenancy.py company/utils.py payroll/services/ || true

      - name: Django system check
        run: python manage.py check --settings=core.settings_test

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=core.settings_test

      - name: Run Django test suite
        run: coverage run manage.py test --settings=core.settings_test && coverage report --fail-under=80

      - name: Static security scan
        run: bandit -r accounting api company core marketing monthyear payroll standup users -x "*/migrations/*,*/tests.py,*/test_*.py,*/tests/*"

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  docker:
    name: Container image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: django

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build container image
        run: podman build --tag payroll-saas:${{ github.sha }} .
