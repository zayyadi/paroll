name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  django:
    name: Django checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DJANGO_SETTINGS_MODULE: core.settings_test
      SECRET_KEY: ci-only-secret-key
      DEBUG: "False"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install CI-only quality tools
        run: |
          pip install bandit pip-audit

      - name: Django system check
        run: python manage.py check --settings=core.settings_test

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run --settings=core.settings_test

      - name: Run Django test suite
        run: python manage.py test --settings=core.settings_test

      - name: Static security scan
        run: bandit -r accounting api company core inventory marketing monthyear payroll standup users -x "*/tests.py,*/test_*.py,*/tests/*"

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: django

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag payroll-saas:${{ github.sha }} .
