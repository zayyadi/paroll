[project]
name = "paroll"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "celery>=5.3.0",
    "channels>=4.0.0",
    "channels-redis>=4.1.0",
    "coverage>=7.5.0",
    "crispy-tailwind>=0.5.0",
    "daphne>=4.0.0",
    "django>=5.1.5,<5.2",
    "django-browser-reload>=1.12.0",
    "django-celery-beat>=2.5.0",
    "django-crispy-forms>=2.0",
    "django-import-export>=3.3.0",
    "django-jazzmin==2.6.0",
    "django-mathfilters>=1.0.0",
    "django-prometheus>=2.3.1",
    "django-redis>=5.4.0",
    "django-tailwind>=3.6.0",
    "django-templated-mail>=1.1.1",
    "django-widget-tweaks>=1.5.0",
    "djangorestframework>=3.15.2",
    "djangorestframework-simplejwt>=5.3.1",
    "drf-spectacular>=0.27.2",
    "faker>=24.0.0",
    "gunicorn>=21.0.0",
    "num2words>=0.5.13",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pillow>=12.3.0",
    "plotly>=5.18.0",
    "premailer>=3.10.0",
    "psycopg[binary]>=3.1.0",
    "pydyf>=0.10,<0.11",
    "pyphen==0.17.2",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "reportlab>=4.0.0",
    "sentry-sdk>=1.40.0",
    "social-auth-app-django>=5.4.0",
    "twilio>=8.10.0",
    "weasyprint==61.2",
    "whitenoise==6.2.0",
    "xhtml2pdf>=0.2.11",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations/*", "static/*", "staticfiles/*", "media/*", ".venv/*", "venv/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
skip = ["migrations"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
ignore_missing_imports = true
exclude = ["migrations/", "tests/", "test_*.py", "staticfiles/", ".venv/", "venv/"]

[tool.coverage.run]
source = ["payroll", "accounting", "company", "api", "users", "standup", "core"]
omit = ["*/migrations/*", "*/tests.py", "*/test_*.py", "*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings_test"
pythonpath = ["."]
